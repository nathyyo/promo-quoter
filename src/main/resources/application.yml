spring:
  application:
    name: promo-quoter
  datasource:
    # LOCK_TIMEOUT: how long a transaction waits for a row lock (ms) before failing with 409.
    url: jdbc:h2:mem:promoquoter;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Lets batch endpoints accept a single object as well as an array.
      accept-single-value-as-array: true
      fail-on-unknown-properties: true

server:
  error:
    include-stacktrace: never
