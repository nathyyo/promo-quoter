spring:
  application:
    name: promo-quoter
  datasource:
    url: jdbc:h2:mem:promoquoter;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
